<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#fbf8f3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Laurie" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laurie's Website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <meta name="description" content="For experiments..." />

    <!-- Open Graph / link previews (WhatsApp, iMessage, Slack, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Laurie's Website" />
    <meta property="og:description" content="For experiments..." />
    <meta property="og:url" content="https://lauriesmith20.github.io/mysite/" />
    <meta property="og:image" content="https://lauriesmith20.github.io/mysite/og-image.png" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Laurie's Website" />
    <meta name="twitter:description" content="For experiments..." />
    <meta name="twitter:image" content="https://lauriesmith20.github.io/mysite/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
