[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lauriesmith20", email = "lauriesmith20@hotmail.co.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "cachetools>=7.1.8",
    "cryptography==48.0.1",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.13.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy-libsql>=0.2.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
api = "backend.cli:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
